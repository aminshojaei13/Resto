server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html index.htm;

    charset utf-8;

    # Logs
    error_log  /var/log/nginx/error.log error;
    access_log /var/log/nginx/access.log;

    client_max_body_size 64M;

    # ------------------------------------------------------------------
    # Health endpoint for the whole stack (mainly useful in Docker).
    # We check Laravel API health here instead of inventing a separate
    # static route.
    # ------------------------------------------------------------------
    location = /health {
        proxy_pass http://app:9000/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
        proxy_connect_timeout 5s;
    }

    # ------------------------------------------------------------------
    # API
    # ------------------------------------------------------------------
    location /api/ {
        try_files '' @api;
    }

    location @api {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_read_timeout 90s;
    }

    # ------------------------------------------------------------------
    # Built web apps (business-web + platform-admin)
    # ------------------------------------------------------------------
    # Business app is served from / unless a path starts with /platform/.
    location / {
        try_files /build/business/index.html =404;
    }

    location /platform/ {
        alias /var/www/html/public/build/admin/;
        index index.html;
        try_files $uri $uri/ /platform/index.html;
    }

    location = /platform {
        return 301 /platform/;
    }

    # ------------------------------------------------------------------
    # Laravel front controller
    # ------------------------------------------------------------------
    location /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 90s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
