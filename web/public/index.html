<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Resto - Multi-Tenant Commerce OS & POS</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;

        min-height: 100%;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
