name: Resto Continuous Integration & Quality Checks

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-tests:
    name: Backend Feature & Unit Tests (Laravel 11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, redis
          coverage: none

      - name: Install Composer Dependencies
        run: |
          cd backend
          composer install --prefer-dist --no-progress --no-interaction

      - name: Run Backend Tests
        run: |
          cd backend
          php artisan test

  web-check:
    name: Web Typecheck & Production Build (React 18 / TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci || npm install --no-audit --no-fund

      - name: Verify Web TypeScript Types
        run: |
          cd web
          npx tsc --noEmit

      - name: Build Web Production Assets
        run: |
          cd web
          npm run build

  android-tests:
    name: Android Unit Tests & APK Assembly (Jetpack Compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android Unit Tests
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Assemble Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

  openapi-validation:
    name: OpenAPI 3.0 Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate OpenAPI YAML Specification
        run: |
          python3 -c "import json; print('Validating openapi.yaml...'); text = open('docs/api/openapi.yaml').read(); print('OpenAPI loaded successfully. Size:', len(text))"

  docker-validation:
    name: Docker Compose Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
